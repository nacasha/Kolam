name: Build macOS installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    env:
      KEYCHAIN: build.keychain
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" Info.plist
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" Info.plist

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PWD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application: .*"' | head -1 | tr -d '"')"
          [ -n "$IDENTITY" ] || { echo "No Developer ID Application identity in certificate"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build DMG
        run: ./make-dmg.sh

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/PondWall.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 20m \
            --output-format json | tee "$RUNNER_TEMP/notary.json"
          STATUS="$(plutil -extract status raw "$RUNNER_TEMP/notary.json")"
          if [ "$STATUS" != "Accepted" ]; then
            ID="$(plutil -extract id raw "$RUNNER_TEMP/notary.json")"
            xcrun notarytool log "$ID" --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            exit 1
          fi
          xcrun stapler staple dist/PondWall.dmg
          spctl -a -t open --context context:primary-signature -vv dist/PondWall.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: PondWall-dmg
          path: dist/PondWall.dmg

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/PondWall.dmg \
            --title "PondWall $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/PondWall.dmg --clobber

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
