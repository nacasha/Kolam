name: Release

# Manual run from main: publishes the DMG from the last successful manual
# "Build macOS installer" run on main, without rebuilding. Commits that build's
# version to Info.plist on top of the commit it was built from, tags it, and
# publishes it as the latest GitHub release.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Find the last build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          read -r RUN_ID SHA < <(gh run list -R "$REPO" --workflow build.yml --branch main \
            --event workflow_dispatch --status success --limit 1 \
            --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')
          [ -n "$RUN_ID" ] || { echo "No successful manual build on main; run 'Build macOS installer' first"; exit 1; }
          gh run download "$RUN_ID" -R "$REPO" --name version --dir "$RUNNER_TEMP/version"
          gh run download "$RUN_ID" -R "$REPO" --name PondWall-dmg --dir dist
          read -r VERSION BUILD < "$RUNNER_TEMP/version/version.txt"
          echo "Releasing $VERSION (build $BUILD) from build run $RUN_ID at $SHA"
          { echo "VERSION=$VERSION"; echo "BUILD=$BUILD"; echo "SHA=$SHA"; } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          path: src

      - name: Commit version and tag
        working-directory: src
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released; run 'Build macOS installer' with a new version first"; exit 1
          fi
          python3 - <<'EOF'
          import os, plistlib
          with open("Info.plist", "rb") as f: info = plistlib.load(f)
          info["CFBundleShortVersionString"] = os.environ["VERSION"]
          info["CFBundleVersion"] = os.environ["BUILD"]
          with open("Info.plist", "wb") as f: plistlib.dump(info, f, sort_keys=False)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag "v$VERSION"
          # Fails (before tagging the remote) if main moved on since the build;
          # run the build again so the release matches main.
          git push origin HEAD:main
          git push origin "v$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/PondWall.dmg -R "${{ github.repository }}" \
            --title "PondWall v$VERSION" --generate-notes --latest
